[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivyr-lite"
version = "0.2.0"
description = "ORDIVYR Lite: a terminal-first, standalone AI execution engine"
readme = "docs/ordivyr-lite/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ELYREON" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/colt2822/ordivyr-lite"
Issues = "https://github.com/colt2822/ordivyr-lite/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ordivyr-lite = "ordivyr_lite.__main__:main"

[tool.setuptools]
packages = ["ordivyr_lite"]

[tool.setuptools.package-data]
ordivyr_lite = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["ordivyr_lite/tests"]
addopts = "-q"
